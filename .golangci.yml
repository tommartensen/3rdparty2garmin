version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - gocritic
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      enable-default-rules: true
      rules:
        # Doc-comment rules target public APIs; all packages here are internal.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
